version: '3.8'

services:
  # シナリオA: クライアント側フォールバック
  scenario-a:
    build:
      context: .
      dockerfile: scenario_a_client/Dockerfile
    container_name: ocr-demo-scenario-a
    environment:
      # 環境変数ファイルから読み込み
      - OCR_ENDPOINTS=${OCR_ENDPOINTS}
      - OCR_KEYS=${OCR_KEYS}
      - USE_SYNC_API=${USE_SYNC_API:-false}
      - FALLBACK_SINGLE_MS=${FALLBACK_SINGLE_MS:-1800}
      - EWMA_ALPHA=${EWMA_ALPHA:-0.2}
      - EWMA_P95_MS=${EWMA_P95_MS:-2000}
      - COOLDOWN_SEC=${COOLDOWN_SEC:-60}
      - MAX_RETRIES_PER_REQUEST=${MAX_RETRIES_PER_REQUEST:-2}
      - GLOBAL_TIMEOUT_MS=${GLOBAL_TIMEOUT_MS:-12000}
    volumes:
      - ./samples:/app/samples:ro
      - ./out:/app/out
    command: ["--images", "/app/samples", "--rps", "${TEST_RPS:-5}", "--duration", "${TEST_DURATION:-120}"]
    profiles:
      - scenario-a
      - all

  # シナリオB: APIM経由OCR
  scenario-b:
    build:
      context: .
      dockerfile: scenario_b_apim/Dockerfile
    container_name: ocr-demo-scenario-b
    environment:
      # APIM設定
      - APIM_GATEWAY=${APIM_GATEWAY}
      - APIM_SUBSCRIPTION_KEY=${APIM_SUBSCRIPTION_KEY}
      - GLOBAL_TIMEOUT_MS=${GLOBAL_TIMEOUT_MS:-12000}
    volumes:
      - ./samples:/app/samples:ro
      - ./out:/app/out
    command: ["--images", "/app/samples", "--rps", "${TEST_RPS:-5}", "--duration", "${TEST_DURATION:-120}"]
    profiles:
      - scenario-b
      - all

  # サンプル画像ダウンロード用サービス
  setup:
    build:
      context: .
      dockerfile: scenario_a_client/Dockerfile
    container_name: ocr-demo-setup
    volumes:
      - ./samples:/app/samples
    command: ["python", "scripts/seed_test_images/download_samples.py", "--output", "/app/samples", "--count", "10"]
    profiles:
      - setup

  # Prometheusメトリクス収集（オプション）
  prometheus:
    image: prom/prometheus:latest
    container_name: ocr-demo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana ダッシュボード（オプション）
  grafana:
    image: grafana/grafana:latest
    container_name: ocr-demo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    profiles:
      - monitoring